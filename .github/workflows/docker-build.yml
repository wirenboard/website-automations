name: Build Docker Image on PR and Merge

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонируем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v3

      # Шаг 2: Сборка Docker-образа
      - name: Build Docker image
        run: |
          docker build -t habr-automation .

      # Шаг 3: Упаковка Docker-образа в tar
      - name: Save Docker image to tar
        run: |
          docker save habr-automation > habr-automation.tar
          mkdir -p artifacts
          mv habr-automation.tar artifacts/

      # Шаг 4: Загрузка артефактов (только для Pull Request)
      - name: Upload artifact for PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v3
        with:
          name: habr-automation-tar
          path: artifacts/habr-automation.tar

      # Шаг 5: Создание релиза (только для main)
      - name: Create Release
        if: ${{ github.event_name == 'push' }}
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v1.0.0
          release_name: "Docker Image Release v1.0.0"
          body: "This release includes the Docker image for the habr-automation script."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Шаг 6: Загрузка артефакта в релиз (только для main)
      - name: Upload Docker tar to Release
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/habr-automation.tar
          asset_name: habr-automation.tar
          asset_content_type: application/x-tar
